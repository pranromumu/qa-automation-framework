

[pytest]
# 1. Tell Robin where your tests live so she doesn't search the whole computer
testpaths = tests

# 2. Default commands Robin should use every time you type 'pytest'
addopts = -v -s --html=reports/report.html --self-contained-html

# 3. Register your custom markers (like the flaky sticker from Project 46!)
markers =
    flaky: marks tests as flaky (deselect with '-m "not flaky"')